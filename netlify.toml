[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[redirects]]
  from = "http://boostkitchen.fr/*"
  to = "https://boostkitchen.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.boostkitchen.fr/*"
  to = "https://boostkitchen.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.boostkitchen.fr/*"
  to = "https://boostkitchen.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/home"
  to = "/"
  status = 301
